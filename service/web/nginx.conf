# Тонкий клиент: статическая страница + прокси на backend (api:8000)
server {
    listen 80;
    client_max_body_size 25m;
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
    }
}
